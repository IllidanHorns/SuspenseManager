# Rate limiting zones (10 МБ хранит ~160 000 IP-адресов)
limit_req_zone  $binary_remote_addr  zone=api:10m     rate=30r/s;
limit_req_zone  $binary_remote_addr  zone=upload:10m  rate=3r/s;
limit_req_zone  $binary_remote_addr  zone=auth:10m    rate=5r/m;
limit_conn_zone $binary_remote_addr  zone=perip:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Не раскрывать версию nginx в заголовках
    server_tokens off;

    # Максимальный размер тела запроса
    client_max_body_size 50m;

    # Защита от медленных атак (Slowloris)
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     30s;
    send_timeout          10s;

    # Ограничение одновременных соединений с одного IP
    limit_conn perip 20;

    # --- Авторизация: жёсткий лимит (5 попыток/мин) ---
    location /api/auth/ {
        limit_req  zone=auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://api:8080/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Загрузка файлов: отдельный строгий лимит ---
    location /api/upload {
        limit_req  zone=upload burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://api:8080/api/upload;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- Остальное API: 30 req/s с burst 50 ---
    location /api/ {
        limit_req  zone=api burst=50 nodelay;
        limit_req_status 429;

        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- React Router ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Статика: кэш на год, без rate limit ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
