services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SuspMgr@2025!"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SuspMgr@2025!' -Q 'SELECT 1' -b -C -No || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: SuspenseManager.Presentation/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SuspenseManager;User Id=sa;Password=SuspMgr@2025!;TrustServerCertificate=True;"
      Jwt__SecretKey: "SuspenseManager_ProductionSecret_ChangeMe_Min32Chars!"
      Jwt__Issuer: "SuspenseManager"
      Jwt__Audience: "SuspenseManagerClient"
      AdminPassword: "Admin123!"
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    restart: on-failure

volumes:
  sqlserver_data:
